[project]
name = "rein"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "bleak>=3.0.2",
    "brainflow>=5.23.0",
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]  # demo/ holds a deliberately failing test for the Claude Code demo
