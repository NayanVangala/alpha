<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rein. gaze test</title>
<link rel="icon" href="/rein-mark.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f2f2f2; --ink: #201d1d; --soft: #57524f; --blue: #0004f6; --line: rgba(32, 29, 29, 0.14); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 "Host Grotesk", "Helvetica Neue", Arial, sans-serif; min-height: 100vh; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 20px; }
  h1 { font-size: 1.4rem; letter-spacing: -0.04em; margin: 0 auto 0 0; font-weight: 500; }
  header a { color: var(--soft); text-underline-offset: 3px; }
  button { font: inherit; font-weight: 500; border: 1px solid var(--ink); background: transparent; color: var(--ink); border-radius: 999px; padding: 10px 18px; cursor: pointer; }
  button.go { background: var(--blue); border-color: var(--blue); color: #fff; }
  #status { padding: 0 20px 12px; color: var(--soft); }
  #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 0 20px 20px; }
  .t { height: 28vh; border-radius: 14px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; font-size: 2rem; letter-spacing: -0.04em; transition: background .25s, color .25s, transform .25s; }
  .t.on { background: var(--blue); color: #fff; transform: scale(1.02); }
  #dot { position: fixed; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: rgba(0, 4, 246, 0.35); border: 2px solid var(--blue); pointer-events: none; z-index: 10; }
  #dot.lost { opacity: 0.25; }
  #cal { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: none; }
  #cal i { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; background: var(--blue); }
  #cal p { position: absolute; left: 0; right: 0; bottom: 8vh; text-align: center; margin: 0; color: var(--soft); }
  #picked { padding: 0 20px 20px; color: var(--soft); }
  .t.aim { outline: 5px solid var(--blue); outline-offset: -5px; }
  #val { position: fixed; z-index: 15; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; border: 4px solid var(--blue); background: #fff; display: none; }
  #result { margin: 0 20px 20px; padding: 16px 18px; background: #fff; border: 1px solid var(--line); border-radius: 12px; display: none; }
  #result b { font-size: 1.6rem; letter-spacing: -0.04em; font-weight: 500; }

@view-transition { navigation: auto; }
::view-transition-old(root) { animation: 0.55s cubic-bezier(0.625, 0.05, 0, 1) both vt-out; }
::view-transition-new(root) { animation: 0.7s cubic-bezier(0.625, 0.05, 0, 1) both vt-in; }
@keyframes vt-out { to { opacity: 0; scale: 1.14; } }
@keyframes vt-in { from { opacity: 0; scale: 0.93; } }
</style>
</head>
<body>
<header>
  <h1>rein gaze test</h1>
  <a href="/board">Open the app</a>
  <a href="/">Slides</a>
  <button id="cal-btn" class="go">Calibrate</button>
  <button id="test-btn">Accuracy test</button>
  <button id="mouse-btn">Use the mouse instead</button>
</header>
<div id="status">Starting…</div>
<div id="grid"></div>
<div id="result" role="status"></div>
<div id="picked">Look at a target and press Space (the stand-in for a bite).</div>
<div id="dot" class="lost"></div>
<div id="val"></div>
<div id="cal"><i></i><p id="cal-text">Look at the dot until it moves.</p></div>
<script type="module" src="/src/gaze.ts"></script>
</body>
</html>
